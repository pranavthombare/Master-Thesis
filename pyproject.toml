[project]
name = "facepay"
version = "2.0.0"
description = "Face verification for payment authentication: FastAPI service with challenge-response liveness, plus the evaluation study behind it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranav Thombare" }]
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
facepay = "facepay.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]
research = [
    "matplotlib>=3.9",
    "onnxruntime>=1.19",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facepay"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs downloaded models and LFW sample images"]
